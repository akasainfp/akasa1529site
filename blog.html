    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Mono&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f7f6f2; --paper: #ffffff; --text: #242424; --muted: #747474; --line: #e8e4dc; --accent: #111111; --soft: #f0eee8; --font-main: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; --font-mono: 'Space Mono', monospace; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg); color: var(--text); font-family: var(--font-main); line-height: 1.9; letter-spacing: 0; }
        a { color: inherit; text-decoration: none; }
        button, a { cursor: pointer; }
        .blog-shell { width: min(1040px, calc(100% - 40px)); margin: 0 auto; }
        .blog-hero { padding: 120px 0 64px; border-bottom: 1px solid var(--line); }
        .blog-kicker { font-family: var(--font-mono); color: #888; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 28px; }
        .blog-title { font-size: clamp(3.6rem, 11vw, 8.5rem); line-height: 0.95; font-weight: 800; letter-spacing: 0; }
        .blog-lead { max-width: 620px; margin-top: 34px; color: var(--muted); font-size: 1rem; }
        .blog-topline { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 28px 0; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 0.72rem; color: #8a8a8a; letter-spacing: 0.12em; }
        .blog-layout { display: block; max-width: 760px; padding: 54px 0 120px; }
        .blog-list { display: grid; gap: 22px; }
        .blog-card { background: var(--paper); border: 1px solid var(--line); padding: 30px; transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease; }
        .blog-card:hover { border-color: #cfc8ba; transform: translateY(-2px); box-shadow: 0 18px 42px rgba(36, 30, 20, 0.07); }
        .blog-eyecatch { display: block; width: 100%; max-width: none; margin: 0 0 24px; aspect-ratio: 2.2 / 1; max-height: 320px; object-fit: cover; border: 1px solid var(--line); background: var(--soft); }
        .blog-meta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; font-family: var(--font-mono); font-size: 0.72rem; color: #999; letter-spacing: 0.08em; }
        .blog-category { color: #555; background: var(--soft); border: 1px solid var(--line); padding: 2px 8px; }
        .blog-card h2 { font-size: clamp(1.35rem, 3vw, 2rem); line-height: 1.45; margin-bottom: 12px; }
        .blog-excerpt { color: var(--muted); font-size: 0.96rem; }
        .blog-body { display: none; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line); color: #333; }
        .blog-body p { margin: 0 0 1em; }
        .blog-body a { text-decoration: underline; text-underline-offset: 3px; }
        .blog-card.is-open .blog-body { display: block; }
        .blog-actions { display: flex; justify-content: flex-end; margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); }
        .blog-toggle { border: 0; background: transparent; color: #555; min-height: auto; padding: 2px 0; font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.08em; cursor: pointer; transition: color 0.2s ease; }
        .blog-toggle:hover, .blog-toggle:focus-visible { color: #111; text-decoration: underline; text-underline-offset: 4px; outline: none; }
        .blog-empty { background: var(--paper); border: 1px solid var(--line); padding: 36px; color: var(--muted); }
        .blog-empty h2 { color: var(--text); margin-bottom: 10px; }
        .blog-footer { border-top: 1px solid var(--line); padding: 58px 0; color: #888; }
        .footer-links { display: flex; flex-wrap: wrap; gap: 16px 26px; margin-bottom: 28px; }
        .footer-link { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; color: #666; }
        .footer-link:hover { color: #111; }
        .footer-bottom { display: flex; justify-content: space-between; gap: 20px; font-family: var(--font-mono); font-size: 0.68rem; color: #aaa; }
        .site-menu-panel { color: #f0f0f0; }
        .site-menu-kicker { color: #ffffff !important; }
        @media (max-width: 760px) { .blog-shell { width: min(100% - 28px, 1040px); } .blog-hero { padding-top: 92px; } .blog-layout { padding-top: 34px; } .blog-topline, .footer-bottom { flex-direction: column; align-items: flex-start; } .blog-card { padding: 24px; } .blog-eyecatch { aspect-ratio: 16 / 9; max-height: 260px; margin-bottom: 22px; } }
    </style>
</head>
<body>
    <header class="blog-shell blog-hero" id="top">
        <div class="blog-kicker">Akasa1529 blog</div>
        <h1 class="blog-title">BLOG</h1>
        <p class="blog-lead">長い記事だけでなく、ふと思ったことも残します。気分によって増えたり止まったりする場所です。</p>
    </header>

    <div class="blog-shell blog-topline">
        <span>SHORT POSTS / NOTES</span>
        <span id="blog-count">LOADING</span>
    </div>

    <main class="blog-shell blog-layout">
        <section class="blog-list" id="blog-list" data-source="blog-data.json">
            <div class="blog-empty"><h2>読み込み中</h2><p>blogを準備しています。</p></div>
        </section>
    </main>

    <footer class="blog-shell blog-footer">
        <div class="footer-links">
            <a href="/" class="footer-link">HOME</a><a href="/profile/" class="footer-link">PROFILE</a><a href="/anime/" class="footer-link">ANIME</a><a href="/movie/" class="footer-link">MOVIE</a><a href="/game/" class="footer-link">GAME</a><a href="/music/" class="footer-link">MUSIC</a><a href="/blog/" class="footer-link">BLOG</a><a href="/archive/" class="footer-link">TOOL</a>
        </div>
        <div class="footer-bottom"><p>&copy; 2026 Akasa1529.</p><p>quiet notes</p></div>
    </footer>

    <script>
        (() => {
            const cleanPages = { '/': 'index.html', '/home/': 'home/index.html', '/profile/': 'profile/index.html', '/anime/': 'anime/index.html', '/movie/': 'movie/index.html', '/game/': 'game/index.html', '/music/': 'music/index.html', '/blog/': 'blog/index.html', '/archive/': 'archive/index.html', '/privacy/': 'privacy/index.html', '/ticket/': 'ticket/index.html' };
            const path = decodeURIComponent(window.location.pathname).replace(/\\/g, '/');
            const nestedPage = /\/(home|profile|anime|movie|game|music|blog|archive|privacy|ticket)\/index\.html$/i.test(path);
            const siteRoot = path.replace(nestedPage ? /\/[^/]+\/index\.html$/i : /\/[^/]+$/i, '/');
            document.querySelectorAll('a[href]').forEach(link => { const href = link.getAttribute('href'); if (!cleanPages[href]) return; link.href = siteRoot + cleanPages[href]; });
        })();
    </script>
    <script src="assets/js/blog-config.js?v=20260609-blog"></script>
    <script src="assets/js/blog-archive.js?v=20260613-noexcerpt"></script>
    <script src="assets/js/site-menu.js?v=20260609-blog"></script>
</body>
</html>
