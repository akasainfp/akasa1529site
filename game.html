                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },

            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
                "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 1 } }, "push": { "particles_nb": 4 } }
            },
            "retina_detect": true
        });
    </script>
    <script>
        const title = document.getElementById('target-title');
        const text = title.innerText; title.innerHTML = '';
        text.split('').forEach((char, i) => {
            const span = document.createElement('span');
            span.innerText = char === ' ' ? '\u00A0' : char;
            span.classList.add('char');
            span.style.animationDelay = `${i * 0.1}s`;
            title.appendChild(span);
        });

        const selectedRatings = new Set();
        const selectedGenres = new Set();
        const selectedHards = new Set();

        window.addEventListener('DOMContentLoaded', async () => {
            if (window.loadGameData) await window.loadGameData();
            sortGamesByScore();
            generateTOC();
            if (window.initGameUi) window.initGameUi();
            window.gameCenterSlider = window.initArchiveCenterSlider?.({ listId: 'game-list', itemSelector: '.game-item', titleSelector: '.game-title' });
            observeGameItems();
        });

        function sortGamesByScore() {
            const list = document.getElementById('game-list');
            const items = Array.from(list.getElementsByClassName('game-item'));
            items.sort((a, b) => parseInt(b.getAttribute('data-score')) - parseInt(a.getAttribute('data-score')));
            items.forEach(item => list.appendChild(item));
        }

        function generateTOC() {
            const tocList = document.getElementById('toc-list');
            const items = document.querySelectorAll('.game-item');
            tocList.innerHTML = '';
            items.forEach(item => {
                if (!item.classList.contains('hidden')) {
                    const title = item.querySelector('.game-title').innerText;
                    const score = item.getAttribute('data-score');
                    const link = document.createElement('a');
                    link.href = `#${item.id}`;
                    link.title = title;
                    link.innerHTML = `[★${score}] ${title}`;
                    link.addEventListener('click', event => {
                        event.preventDefault();
                        item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        history.replaceState(null, '', `#${item.id}`);
                    });
                    tocList.appendChild(link);
                }
            });
        }
        function toggleFilterDialog(open) {
            const dialog = document.getElementById('filter-dialog');
            if (!dialog) return;
            dialog.classList.toggle('is-open', open);
            dialog.setAttribute('aria-hidden', open ? 'false' : 'true');
        }

        document.addEventListener('click', event => {
            const dialog = document.getElementById('filter-dialog');
            if (dialog && event.target === dialog) toggleFilterDialog(false);
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') toggleFilterDialog(false);
        });

        function toggleSeries(button) {
            const panel = document.getElementById(button.getAttribute('aria-controls'));
            if (!panel) return;
            const open = !panel.classList.contains('is-open');
            panel.classList.toggle('is-open', open);
            button.setAttribute('aria-expanded', String(open));
            button.textContent = open ? 'CLOSE TITLES' : 'TITLES';
        }

        function filterRating(val) {
            toggleFilter(selectedRatings, val);
            updateFilterButtons(0, selectedRatings);
            applyFilters();
        }

        function filterGenre(val) {
            toggleFilter(selectedGenres, val);
            updateFilterButtons(1, selectedGenres);
            applyFilters();
        }

        function filterHard(val) {
            toggleFilter(selectedHards, val);
            updateFilterButtons(2, selectedHards);
            applyFilters();
        }

        function clearFilters() {
            selectedRatings.clear();
            selectedGenres.clear();
            selectedHards.clear();
            updateFilterButtons(0, selectedRatings);
            updateFilterButtons(1, selectedGenres);
            updateFilterButtons(2, selectedHards);
            applyFilters();
        }

        function getFilterButtonValue(btn) {
            if (btn.dataset.filterValue) return btn.dataset.filterValue;
            const action = btn.getAttribute('onclick') || '';
            const match = action.match(/\('([^']+)'\)/);
            return match ? match[1] : '';
        }

        function updateFilterButtons(groupIdx, selected) {
            const group = document.querySelectorAll('.filter-group')[groupIdx];
            if (!group) return;
            group.querySelectorAll('.f-btn').forEach(btn => {
                const value = getFilterButtonValue(btn);
                btn.classList.toggle('active', value === 'all' ? selected.size === 0 : selected.has(value));
            });
        }

        function toggleFilter(set, value) {
            if (value === 'all') {
                set.clear();
                return;
            }
            if (set.has(value)) {
                set.delete(value);
                return;
            }
            set.add(value);
        }

        function matchesValue(selected, value) {
            return selected.size === 0 || selected.has(String(value));
        }

        function matchesTokens(selected, value) {
            if (selected.size === 0) return true;
            const tokens = String(value || '').split(/\s+/).filter(Boolean);
            return tokens.some(token => selected.has(token));
        }


        function handleFilterControlClick(event) {
            const button = event.target.closest('button');
            if (!button || !button.closest('.filter-dialog, .archive-toolbar')) return;

            const action = button.getAttribute('onclick') || '';
            const value = getFilterButtonValue(button);

            if (button.classList.contains('toc-filter-toggle')) {
                event.preventDefault();
                event.stopImmediatePropagation();
                toggleFilterDialog(true);
                return;
            }
            if (button.classList.contains('filter-close')) {
                event.preventDefault();
                event.stopImmediatePropagation();
                toggleFilterDialog(false);
                return;
            }
            if (!button.classList.contains('f-btn')) return;

            event.preventDefault();
            event.stopImmediatePropagation();

            if (button.dataset.filterAction === 'clear' || action.startsWith('clearFilters')) {
                clearFilters();
                return;
            }
            if (!value) return;
            if (button.dataset.filterGroup === 'rating' || action.startsWith('filterRating')) {
                filterRating(value);
                return;
            }
            if (button.dataset.filterGroup === 'genre' || action.startsWith('filterGenre')) {
                filterGenre(value);
                return;
            }
            if (button.dataset.filterGroup === 'hard' || action.startsWith('filterHard')) {
                filterHard(value);
            }
        }

        document.addEventListener('click', handleFilterControlClick, true);

        function applyFilters() {
            document.querySelectorAll('.game-item').forEach(item => {
                const genre = item.getAttribute('data-category') || '';
                const score = item.getAttribute('data-score');
                const hard = item.getAttribute('data-hard') || '';
                const ratingMatch = matchesValue(selectedRatings, score);
                const genreMatch = matchesTokens(selectedGenres, genre);
                const hardMatch = matchesTokens(selectedHards, hard);
                item.classList.toggle('hidden', !(ratingMatch && genreMatch && hardMatch));
            });
            generateTOC();
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                entry.target.classList.toggle('is-animated', entry.isIntersecting);
            });
        }, { threshold: 0.15 });

        function observeGameItems() {
            document.querySelectorAll('.anim-box').forEach(box => observer.observe(box));
        }
    </script>
    <script>
        (() => {
            if (window.location.protocol !== 'file:') return;
            const cleanPages = {
                '/': 'index.html',
                '/home/': 'home/index.html',
                '/profile/': 'profile/index.html',
                '/anime/': 'anime/index.html',
                '/movie/': 'movie/index.html',
                '/game/': 'game/index.html',
                '/music/': 'music/index.html',
                '/blog/': 'blog/index.html',
                '/archive/': 'archive/index.html',
                '/privacy/': 'privacy/index.html',
                '/ticket/': 'ticket/index.html'
            };
            const path = decodeURIComponent(window.location.pathname).replace(/\\/g, '/');
            const nestedPage = /\/(home|profile|anime|movie|game|music|blog|archive|privacy|ticket)\/index\.html$/i.test(path);
            const siteRoot = path.replace(nestedPage ? /\/[^/]+\/index\.html$/i : /\/[^/]+$/i, '/');
            document.querySelectorAll('a[href]').forEach(link => {
                const href = link.getAttribute('href');
                if (!cleanPages[href]) return;
                link.href = siteRoot + cleanPages[href];
            });
        })();
    </script>
