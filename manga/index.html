    <style>
        :root {
            --bg: #000000;
            --accent: #7d5fff;
            --text: #ffffff;
            --font-main: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            overflow-x: hidden;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        /* --- 1. 背景システム (Particles.js用) --- */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -5;
            background-color: #000;
        }

        .grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.12; pointer-events: none; z-index: -1;
        }

        /* ヘッダー */
        .hero { height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); background: radial-gradient(circle at center, rgba(125, 95, 255, 0.05) 0%, transparent 70%); }
        .main-title { font-size: clamp(3rem, 12vw, 8rem); font-weight: 800; letter-spacing: -0.04em; }
        .char { display: inline-block; opacity: 0; transform: translateY(30px); filter: blur(10px); animation: revealChar 0.8s cubic-bezier(0.2, 1, 0.3, 1) forwards; }
        @keyframes revealChar { to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        .anim-box { opacity: 0; transform: translateY(50px); transition: all 1.2s cubic-bezier(0.2, 1, 0.3, 1); }
        .anim-box.is-animated { opacity: 1; transform: translateY(0); }

        /* フィルターセクション */
        .filter-controls {
            max-width: 1100px;
            margin: 40px auto 20px;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .filter-group { display: flex; gap: 8px; align-items: center; }
        .filter-label { font-family: var(--font-mono); font-size: 0.6rem; color: #555; text-transform: uppercase; letter-spacing: 0.1em; }

        .f-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: #888;
            padding: 5px 12px;
            font-size: 0.7rem;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: 0.3s;
        }
        .f-btn.active {
            border-color: var(--accent) !important;
            color: var(--accent) !important;
            background: rgba(125, 95, 255, 0.15) !important;
            box-shadow: 0 0 10px rgba(125, 95, 255, 0.2);
        }

        /* 目次 */
        .table-of-contents {
            max-width: 1100px;
            margin: 20px auto 40px;
            padding: 25px;
            background: rgba(125, 95, 255, 0.01);
            border: 1px solid rgba(125, 95, 255, 0.05);
        }
        .toc-title { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); margin-bottom: 15px; text-align: center; }
        .toc-links { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; font-size: 0.75rem; }
        .toc-links a { color: #666; text-decoration: none; transition: 0.3s; padding: 2px 8px; border-left: 1px solid transparent; display: block; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .toc-links a:hover { color: var(--accent); border-left: 1px solid var(--accent); }

        /* 作品リスト */

        .archive-toolbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; margin-bottom: 18px; }
        .archive-toolbar .toc-title { grid-column: 2; margin-bottom: 0; }
        .toc-filter-toggle {
            grid-column: 3;
            justify-self: end;
            min-width: 112px;
            padding: 9px 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 0.66rem;
            letter-spacing: 0.16em;
            transition: 0.3s;
        }
        .toc-filter-toggle:hover { color: #fff; border-color: var(--accent); background: rgba(125,95,255,0.08); transform: translateY(-2px); }
        .toc-filter-toggle, .filter-close, .f-btn { position: relative; z-index: 2; pointer-events: auto; cursor: pointer; }
        .filter-controls { display: none; }
        .filter-dialog {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(10px);
        }
        .filter-dialog.is-open { display: flex; }
        .filter-panel {
            width: min(680px, 100%);
            padding: 28px;
            background: rgba(5,5,8,0.96);
            border: 1px solid rgba(125,95,255,0.28);
            box-shadow: 0 18px 60px rgba(0,0,0,0.45);
        }
        .filter-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
        .filter-panel-title { font-family: var(--font-mono); color: var(--accent); font-size: 0.75rem; letter-spacing: 0.2em; }
        .filter-close { width: 34px; height: 34px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #888; font-size: 1rem; transition: 0.3s; }
        .filter-close:hover { color: #fff; border-color: var(--accent); }
        .filter-panel .filter-controls { display: flex; margin: 0; padding: 0; justify-content: flex-start; }
        .filter-panel .filter-group { flex-wrap: wrap; align-items: flex-start; margin-bottom: 14px; }
        .filter-panel .filter-group:last-child { margin-bottom: 0; }
        .f-btn:hover { color: #fff; border-color: rgba(125,95,255,0.65); background: rgba(125,95,255,0.08); transform: translateY(-1px); }
        .toc-links a:hover { color: #fff; border-left: 1px solid var(--accent); transform: translateX(4px); }
        @media (max-width: 768px) {
            .archive-toolbar { grid-template-columns: 1fr; }
            .archive-toolbar .toc-title, .toc-filter-toggle { grid-column: 1; justify-self: center; }
            .toc-filter-toggle { width: 100%; max-width: 220px; }
        }
        .section-container { max-width: 900px; margin: 0 auto; padding: 20px; }

        .manga-item {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px;
            margin-bottom: 30px;
            transition: 0.5s ease;
        }
        .manga-item.hidden { display: none !important; }
        @media (max-width: 768px) { .manga-item { grid-template-columns: 1fr; } }

        /* サムネイル */
        .manga-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }
        .manga-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .manga-thumb::after {
            content: 'NO IMAGE';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.5rem;
            color: #222;
            z-index: -1;
        }

        .rating { font-family: var(--font-mono); color: var(--accent); font-size: 0.8rem; margin-bottom: 10px; display: block; }
        .manga-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; }
        .synopsis { font-size: 0.85rem; color: #aaa; margin-bottom: 20px; }


        .empty-state { border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.01); padding: 34px; margin-bottom: 30px; }
        .empty-state h2 { color: var(--accent); font-size: 1.35rem; margin-bottom: 12px; }
        .empty-state p { color: #aaa; font-size: 0.9rem; }
/* 検索ボタン */
        .search-links { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-search {
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            padding: 6px 12px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #666;
            transition: 0.3s;
        }
        .btn-search:hover { border-color: var(--accent); color: var(--accent); background: rgba(125, 95, 255, 0.05); }

        /* Footer */
        footer {
            padding: 100px 0 50px;
            background: #000;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-family: var(--font-main);
        }
        .footer-content { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
        .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px; margin-bottom: 80px; }
        .footer-col h4 { font-family: var(--font-mono); font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 25px; }
        .footer-links { display: flex; flex-direction: column; gap: 12px; }
        .footer-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; transition: 0.3s; }
        .footer-link:hover { color: #fff; padding-left: 5px; }
        .footer-bottom { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 40px; font-family: var(--font-mono); font-size: 0.65rem; color: #333; }
    </style></head>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <script>
        // 1. Particles.js 設定
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": false },
                "size": { "value": 3, "random": true },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#ffffff",
                    "opacity": 0.4,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 2,
                    "direction": "none",
                    "random": false,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": true, "mode": "grab" },
                    "onclick": { "enable": true, "mode": "push" },
                    "resize": true
                },
                "modes": {
                    "grab": { "distance": 140, "line_linked": { "opacity": 1 } },
                    "push": { "particles_nb": 4 }
                }
            },
            "retina_detect": true
        });
    </script>

    <script>
        // タイトルの出現演出
        const title = document.getElementById('target-title');
        const text = title.innerText; title.innerHTML = '';
        text.split('').forEach((char, i) => {
            const span = document.createElement('span');
            span.innerText = char === ' ' ? '\u00A0' : char;
            span.classList.add('char');
            span.style.animationDelay = `${i * 0.1}s`;
            title.appendChild(span);
        });

        let currentRating = 'all';
        let currentGenre = 'all';

        window.addEventListener('DOMContentLoaded', () => {
            sortMangaByScore();
            generateTOC();
        });

        function sortMangaByScore() {
            const list = document.getElementById('manga-list');
            const items = Array.from(list.getElementsByClassName('manga-item'));
            items.sort((a, b) => b.getAttribute('data-score') - a.getAttribute('data-score'));
            items.forEach(item => list.appendChild(item));
        }

        function generateTOC() {
            const tocList = document.getElementById('toc-list');
            const items = document.querySelectorAll('.manga-item');
            tocList.innerHTML = '';
            items.forEach(item => {
                if (!item.classList.contains('hidden')) {
                    const title = item.querySelector('.manga-title').innerText;
                    const score = item.getAttribute('data-score');
                    const link = document.createElement('a');
                    link.href = `#${item.id}`;
                    link.title = title;
                    link.innerHTML = `[★${score}] ${title}`;
                    tocList.appendChild(link);
                }
            });
        }
        function toggleFilterDialog(open) {
            const dialog = document.getElementById('filter-dialog');
            if (!dialog) return;
            dialog.classList.toggle('is-open', open);
            dialog.setAttribute('aria-hidden', open ? 'false' : 'true');
        }

        document.addEventListener('click', event => {
            const dialog = document.getElementById('filter-dialog');
            if (dialog && event.target === dialog) toggleFilterDialog(false);
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') toggleFilterDialog(false);
        });

        function filterRating(val) {
            currentRating = val;
            updateFilterButtons('rating', val);
            applyFilters();
        }

        function filterGenre(val) {
            currentGenre = val;
            updateFilterButtons('genre', val);
            applyFilters();
        }

        function getFilterButtonValue(btn) {
            const action = btn.getAttribute('onclick') || '';
            const match = action.match(/\('([^']+)'\)/);
            return match ? match[1] : '';
        }

        function updateFilterButtons(type, val) {
            const groupIdx = type === 'rating' ? 0 : 1;
            const group = document.querySelectorAll('.filter-group')[groupIdx];
            if (!group) return;
            group.querySelectorAll('.f-btn').forEach(btn => {
                btn.classList.toggle('active', getFilterButtonValue(btn) === val);
            });
        }


        function handleFilterControlClick(event) {
            const button = event.target.closest('button');
            if (!button) return;
            if (button.classList.contains('toc-filter-toggle')) {
                event.preventDefault();
                toggleFilterDialog(true);
                return;
            }
            if (button.classList.contains('filter-close')) {
                event.preventDefault();
                toggleFilterDialog(false);
                return;
            }
            const action = button.getAttribute('onclick') || '';
            const value = getFilterButtonValue(button);
            if (!value) return;
            if (action.startsWith('filterRating')) {
                event.preventDefault();
                filterRating(value);
                return;
            }
            if (action.startsWith('filterGenre')) {
                event.preventDefault();
                filterGenre(value);
                return;
            }
        }

        document.addEventListener('click', handleFilterControlClick);

        function applyFilters() {
            document.querySelectorAll('.manga-item').forEach(item => {
                const score = parseInt(item.getAttribute('data-score'));
                const genres = item.getAttribute('data-genre') || '';
                const rMatch = currentRating === 'all' || String(score) === currentRating;
                const gMatch = (currentGenre === 'all') || genres.includes(currentGenre);
                item.classList.toggle('hidden', !(rMatch && gMatch));
            });
            generateTOC();
        }

        // スクロール監視
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                entry.target.classList.toggle('is-animated', entry.isIntersecting);
            });
        }, { threshold: 0.15 });

        document.querySelectorAll('.anim-box').forEach(box => observer.observe(box));
    </script>
    <script>
        (() => {
            if (window.location.protocol !== 'file:') return;
            const cleanPages = {
                '/': 'index.html',
                '/home/': 'home/index.html',
                '/profile/': 'profile/index.html',
                '/anime/': 'anime/index.html',
                '/manga/': 'manga/index.html',
                '/game/': 'game/index.html',
                '/archive/': 'archive/index.html',
                '/privacy/': 'privacy/index.html',
                '/ticket/': 'ticket/index.html'
            };
            const path = decodeURIComponent(window.location.pathname).replace(/\\/g, '/');
            const nestedPage = /\/(home|profile|anime|manga|game|archive|privacy|ticket)\/index\.html$/i.test(path);
            const siteRoot = path.replace(nestedPage ? /\/[^/]+\/index\.html$/i : /\/[^/]+$/i, '/');
            document.querySelectorAll('a[href]').forEach(link => {
                const href = link.getAttribute('href');
                if (!cleanPages[href]) return;
                link.href = siteRoot + cleanPages[href];
            });
        })();
    </script>
